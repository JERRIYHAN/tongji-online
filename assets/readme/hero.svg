<text x="64" y="382" font-family="Arial, sans-serif" font-size="16" fill="#4d6b7a" opacity=".75">01</text><text x="102" y="382" font-size="20" font-weight="500" fill="#4d6b7a">CANVAS · 课程作业</text><text x="64" y="427" font-size="27" font-weight="500" fill="#2d4350">未来七天，有哪些作业要交？</text><text x="64" y="461" font-size="20" fill="#75847e">截止时间 · 提交状态 · 作业要求</text><text x="650" y="382" font-family="Arial, sans-serif" font-size="16" fill="#658274" opacity=".75">02</text><text x="688" y="382" font-size="20" font-weight="500" fill="#658274">图书馆 · 座位预约</text><text x="650" y="427" font-size="27" font-weight="500" fill="#2d4350">六楼有空位吗？帮我约到闭馆。</text><text x="650" y="461" font-size="20" fill="#75847e">普通座位 · 研修座位 · 考研座位</text><text x="64" y="546" font-family="Arial, sans-serif" font-size="16" fill="#658274" opacity=".75">03</text><text x="102" y="546" font-size="20" font-weight="500" fill="#658274">研习室 · 多人讨论</text><text x="64" y="591" font-size="27" font-weight="500" fill="#2d4350">明天下午，找间三人讨论室。</text><text x="64" y="625" font-size="20" fill="#75847e">按人数和时段，找到合适空间</text><text x="650" y="546" font-family="Arial, sans-serif" font-size="16" fill="#4d6b7a" opacity=".75">04</text><text x="688" y="546" font-size="20" font-weight="500" fill="#4d6b7a">培养计划 · 学分进度</text><text x="650" y="591" font-size="27" font-weight="500" fill="#2d4350">我的学分，还差在哪些类别？</text><text x="650" y="625" font-size="20" fill="#75847e">分类要求 · 已修学分 · 完成差额</text><text x="64" y="710" font-family="Arial, sans-serif" font-size="16" fill="#897a67" opacity=".75">05</text><text x="102" y="710" font-size="20" font-weight="500" fill="#897a67">社会实践 · 完成情况</text><text x="64" y="755" font-size="27" font-weight="500" fill="#2d4350">社会实践课完成了多少？</text><text x="64" y="789" font-size="20" fill="#75847e">学习进度 · 认定学时 · 课程成绩</text><text x="650" y="710" font-family="Arial, sans-serif" font-size="16" fill="#897a67" opacity=".75">06</text><text x="688" y="710" font-size="20" font-weight="500" fill="#897a67">官方文件 · 电子下载</text><text x="650" y="755" font-size="27" font-weight="500" fill="#2d4350">找到英文成绩单的下载入口。</text><text x="650" y="789" font-size="20" fill="#75847e">中英文成绩单 · 在读证明</text><path d="M64 838H1136" stroke="#c9d5cf"/>

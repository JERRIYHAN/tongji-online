<text x="60" y="160" font-size="70" font-weight="600" letter-spacing="2" fill="#2d4350">同济校园助手</text>
<text x="64" y="220" font-size="30" fill="#3e5a6b">一句话，安排好校园日常。</text>
<text x="64" y="274" font-size="21" fill="#6c7e79">查作业、找座位、看学业进度，直接对 AI 助手说。</text>
